[package]
name = "voxtype"
version = "0.1.2"
description = "AI-powered speech-to-text and text polishing desktop app"
authors = ["VoxType Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "voxtype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# ── Updater (desktop only) ──
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
enigo = "0.2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
arboard = "3"
http = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
url = "2"
base64 = "0.22"
sensevoice-rs = { version = "0.1.7", default-features = false }
sha2 = "0.10"
dirs = "5"

# ── Patched sensevoice-rs with bundled VAD path support ──
# Original hardcodes hf_hub::Api for VAD model loading (model.pt + am.mvn).
# Our patch adds optional `VadConfig.{model_path, cmvn_path}` fields
# so VAD can load from local bundled files without any network access.
[patch.crates-io]
sensevoice-rs = { path = "patched-crates/sensevoice-rs" }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = "thin"
strip = true
